name: mirror-to-gitee

# 把 GitHub 上的每次 push 镜像到 Gitee，作为 autoship 的兜底源。
# 需要两个仓库机密：GITEE_USER、GITEE_TOKEN（projects 权限即可）。

on:
  push:
  workflow_dispatch:

concurrency:
  group: mirror-to-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitHub mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo.git

      - name: Push to Gitee
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO: ${{ github.event.repository.name }}
        run: |
          cd repo.git
          # GitHub 的 refs/pull/* 在 Gitee 上属于隐藏引用，必须剔除
          git for-each-ref --format='%(refname)' refs/pull | xargs -r -n1 git update-ref -d || true
          git push --mirror "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${REPO}.git"
